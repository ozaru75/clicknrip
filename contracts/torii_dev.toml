# Torii indexer configuration for clicknrip world
# Start with: torii --world <WORLD_ADDRESS> --config ./torii_dev.toml --db-dir ./torii

[server]
http_cors_origins = ["*"]

[indexing]
# Track ERC20 tokens for balance indexing
contracts = [
  "erc20:0x49d36570d4e46f48e99674bd3fcc84644ddd6b96f7c741b1562b82f9e004dc7",  # ETH fee token
  "erc20:0x4718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d",  # STRK fee token
]

[sql]
# Historical event indexing for game state
historical = [
  "clicknrip-GameCreated",
  "clicknrip-GuessResolved",
  "clicknrip-GameEnded"
]
